server:
  port: ${SERVER_PORT:8792}
  forward-headers-strategy: framework

spring:
  application:
    name: ds-agent-server
  datasource:
    url: ${DB_URL:jdbc:h2:mem:dsagent;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASS:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.ssl.enable: ${SMTP_SSL:false}
      mail.smtp.ssl.checkserveridentity: ${SMTP_SSL_CHECK_SERVER_IDENTITY:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.starttls.required: ${SMTP_STARTTLS_REQUIRED:${SMTP_STARTTLS:false}}
      mail.smtp.connectiontimeout: ${SMTP_CONNECTION_TIMEOUT_MS:5000}
      mail.smtp.timeout: ${SMTP_READ_TIMEOUT_MS:10000}
      mail.smtp.writetimeout: ${SMTP_WRITE_TIMEOUT_MS:10000}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: false

management:
  health:
    mail:
      enabled: ${AUTH_MAIL_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

app:
  studyroom-generation:
    enabled: ${STUDYROOM_GENERATION_ENABLED:true}
    poll-interval-ms: ${STUDYROOM_POLL_INTERVAL_MS:1000}
    capacity: ${STUDYROOM_WORKER_CAPACITY:2}
    fragment-budget:
      maximum-calls: ${STUDYROOM_FRAGMENT_MAX_CALLS:4}
      maximum-tokens: ${STUDYROOM_FRAGMENT_MAX_TOKENS:20000}
      maximum-active-time: ${STUDYROOM_FRAGMENT_MAX_ACTIVE_TIME:PT8M}
  security:
    jwt-secret: ${JWT_SECRET}
    token-ttl: ${AUTH_TOKEN_TTL:PT2H}
    issuer: ${AUTH_TOKEN_ISSUER:ds-agent}
    cookie-name: ${AUTH_COOKIE_NAME:ds_session}
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    bootstrap-admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    teacher-emails: ${TEACHER_EMAILS:}
    node-compat-enabled: ${NODE_COMPAT_ENABLED:false}
    node-compat-jwt-secret: ${NODE_COMPAT_JWT_SECRET:}
  auth:
    verification-ttl: ${AUTH_CODE_TTL:PT10M}
    maximum-code-attempts: ${AUTH_CODE_MAX_ATTEMPTS:5}
    expose-development-code: ${AUTH_EXPOSE_DEV_CODE:false}
    mail-enabled: ${AUTH_MAIL_ENABLED:false}
    mail-from: ${SMTP_FROM:no-reply@example.com}
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_PROVISION_ENABLED:false}
    reconcile-existing: ${BOOTSTRAP_ADMIN_PROVISION_RECONCILE_EXISTING:false}
    email: ${BOOTSTRAP_ADMIN_PROVISION_EMAIL:}
    username: ${BOOTSTRAP_ADMIN_PROVISION_USERNAME:}
    password: ${BOOTSTRAP_ADMIN_PROVISION_PASSWORD:}
  model:
    provider: ${MODEL_PROVIDER:}
    api-key: ${MODEL_API_KEY:}
    base-url: ${MODEL_BASE_URL:}
    # No vendor model is named here on purpose. A model id baked into the repository goes stale the
    # day the provider retires it, and the failure then looks like a bug in the application rather
    # than a missing setting - which is exactly what happened once already. Production and the local
    # stack both set MODEL_NAME explicitly, and an unset name reports the model as unconfigured.
    name: ${MODEL_NAME:}
    timeout: ${MODEL_TIMEOUT:PT45S}
    stream-idle-timeout: ${MODEL_STREAM_IDLE_TIMEOUT:PT30S}
    maximum-response-bytes: ${MODEL_MAX_RESPONSE_BYTES:33554432}
    # true: never ask the provider to spend tokens on hidden reasoning (DeepSeek "thinking").
    # Retrieval supplies the facts, so reasoning tokens are pure cost here.
    disable-thinking: ${MODEL_DISABLE_THINKING:true}
  ai-quota:
    daily-token-quota: ${AI_DAILY_TOKEN_QUOTA:0}
    maximum-concurrent-requests: ${AI_MAX_CONCURRENT_REQUESTS:1}
    reservation-ttl: ${AI_QUOTA_RESERVATION_TTL:PT2M}
  knowledge:
    enabled: ${KNOWLEDGE_ENABLED:true}
    auto-publish-local: ${KNOWLEDGE_AUTO_PUBLISH_LOCAL:false}
    directory: ${KNOWLEDGE_DIR:../../private/knowledge}
    minimum-score: ${KNOWLEDGE_MIN_SCORE:8}
    search-limit: ${KNOWLEDGE_SEARCH_LIMIT:4}
    chunk-size: ${KNOWLEDGE_CHUNK_SIZE:1100}
  chat:
    attachments:
      directory: ${CHAT_ATTACHMENTS_DIR:../../private/chat-attachments}
  resources:
    directory: ${RESOURCE_DIR:../../private/course-content}
  classroom:
    # model: the model narrates each courseware page from the reviewed textbook.
    # deterministic: the spine is assembled locally, for inspecting the classroom without a model call.
    slide-narration: ${CLASSROOM_SLIDE_NARRATION:model}
  presentation:
    enabled: ${PRESENTATION_ENABLED:true}
    directory: ${PRESENTATION_DIR:../../../../presentation-materials}
    image-directory: ${PRESENTATION_IMAGE_DIR:}
    annotations: ${PRESENTATION_ANNOTATIONS:../../private/presentation-annotations/slides.annotations.json}
    # Signs the urls courseware pages are served from. The url is a capability - anyone holding it can read
    # that one page - so the key has to be a real secret. It also has to be stable: the url is cached for as
    # long as the page exists, and rotating this value is what invalidates every url at once.
    asset-secret: ${PRESENTATION_ASSET_SECRET:${JWT_SECRET:local-development-only-asset-secret}}
  animation:
    maximum-concurrent-simulations: ${ANIMATION_MAX_CONCURRENT:4}
  dsvp:
    engine:
      # The local deterministic engine (backend/dsvp) computes every animation frame. It is asked first;
      # without it the frozen nine-structure in-process simulator still serves the contract.
      enabled: ${DSVP_ENGINE_ENABLED:true}
      command: ${DSVP_ENGINE_COMMAND:node}
      script: ${DSVP_ENGINE_SCRIPT:../dsvp/dsvp-service.js}
      timeout-ms: ${DSVP_ENGINE_TIMEOUT_MS:6000}
  compiler:
    piston-base-url: ${PISTON_BASE_URL:}
    timeout: ${EXECUTE_TIMEOUT:PT15S}
    maximum-code-length: ${EXECUTE_CODE_MAX_LENGTH:20000}
    maximum-input-length: ${EXECUTE_INPUT_MAX_LENGTH:12000}
    maximum-output-length: ${EXECUTE_OUTPUT_MAX_LENGTH:6000}
    maximum-concurrent-executions: ${EXECUTE_MAX_CONCURRENT:16}
    maximum-concurrent-executions-per-client: ${EXECUTE_MAX_CONCURRENT_PER_CLIENT:8}
    compile-timeout-millis: ${EXECUTE_COMPILE_TIMEOUT_MS:10000}
    run-timeout-millis: ${EXECUTE_RUN_TIMEOUT_MS:3000}
  # Interactive console: the program stays alive between keystrokes instead of being handed its
  # whole input up front. Off until the host actually ships a compiler.
  sandbox:
    enabled: ${SANDBOX_ENABLED:false}
    gcc-command: ${SANDBOX_GCC_COMMAND:gcc}
    python-command: ${SANDBOX_PYTHON_COMMAND:python3}
    maximum-sessions: ${SANDBOX_MAX_SESSIONS:32}
    session-idle-timeout-seconds: ${SANDBOX_IDLE_TIMEOUT_SECONDS:180}
    session-maximum-lifetime-seconds: ${SANDBOX_LIFETIME_SECONDS:900}
    compile-timeout-millis: ${SANDBOX_COMPILE_TIMEOUT_MS:20000}
    maximum-output-length: ${SANDBOX_MAX_OUTPUT_LENGTH:60000}
    # Empty means the system temporary directory. A host whose tmpfs is mounted noexec must point
    # this at a writable volume that allows execution, or no compiled program can run.
    work-directory: ${SANDBOX_WORK_DIRECTORY:}

logging:
  level:
    root: INFO
    com.feng.dsagent: INFO
